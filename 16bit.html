<script>/* ===== 16-bit pixel kit (Mega Drive look) ===== */
const MDL=[0,36,73,109,146,182,219,255];
function snap(h){h=h.replace('#','');const n=parseInt(h,16);const s=v=>MDL.reduce((a,c)=>Math.abs(c-v)<Math.abs(a-v)?c:a);return'rgb('+s(n>>16&255)+','+s(n>>8&255)+','+s(n&255)+')';}
const C={};function pal(o){for(const k in o)C[k]=snap(o[k]);}
pal({ink:'#1c0c14',black:'#000000',white:'#ffffff',off:'#dbdbdb',grey:'#929292',grey2:'#6d6d6d',grey3:'#494949',
 y1:'#ffff6d',y2:'#ffdb24',o1:'#ffb624',o2:'#ff9224',o3:'#db6d00',r1:'#ff4924',r2:'#b62400',r3:'#6d0000',
 navy:'#000049',navy2:'#000024',ind:'#24246d',ind2:'#492492',vio:'#6d2492',mag:'#b6246d',pink:'#ff92b6',pink2:'#db6d92',
 sky1:'#002449',sky2:'#24246d',sky3:'#492492',sky4:'#92246d',sky5:'#db4949',
 c1:'#92ffff',c2:'#24b6db',c3:'#006d92',g1:'#92ff49',g2:'#24b624',g3:'#006d24',
 w1:'#dbb66d',w2:'#b6926d',w3:'#926d49',w4:'#6d4924',w5:'#492400',
 cream:'#ffdbb6',beige:'#dbb692',sand:'#ffdb92'});
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}
function P(g,x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function E(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry);y++){let a=1e9,b=-1e9;for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1){if(x<a)a=x;if(x>b)b=x;}}if(b>=a)g.fillRect(a,y,b-a+1,1);}}
function Ln(g,x0,y0,x1,y1,c,t){t=t||1;x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;g.fillStyle=c;
 for(;;){g.fillRect(x0-(t>>1),y0-(t>>1),t,t);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function curve(g,pts,c,t){for(let i=0;i<pts.length-1;i++)Ln(g,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],c,t);}
function D(g,x,y,w,h,c1,c2,ph){for(let j=0;j<h;j++)for(let i=0;i<w;i++){g.fillStyle=((i+j+(ph||0))&1)?c2:c1;g.fillRect(x+i,y+j,1,1);}}
function bands(g,x,y,w,h,cols){const n=cols.length;for(let k=0;k<n;k++){const y0=Math.round(y+k*h/n),y1=Math.round(y+(k+1)*h/n);R(g,x,y0,w,y1-y0,cols[k]);
 if(k<n-1){g.fillStyle=cols[k+1];for(let i=0;i<w;i+=2)g.fillRect(x+i,y1-1,1,1);g.fillStyle=cols[k];for(let i=1;i<w;i+=2)g.fillRect(x+i,y1,1,1);}}}
function outline(c,col,diag){const g=c.getContext('2d'),W=c.width,H=c.height,im=g.getImageData(0,0,W,H),d=im.data;const a=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&d[(y*W+x)*4+3]>0;const pts=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!a(x,y)&&(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)||diag&&(a(x-1,y-1)||a(x+1,y-1)||a(x-1,y+1)||a(x+1,y+1))))pts.push(x,y);
 g.fillStyle=col;for(let i=0;i<pts.length;i+=2)g.fillRect(pts[i],pts[i+1],1,1);return c;}
function flipC(c){const [o,g]=mk(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o;}
function shadowUnder(g,cx,y,w){for(let i=-w;i<=w;i++){if(((i+y)&1)===0||Math.abs(i)<w*.6)P(g,cx+i,y,'rgba(0,0,0,.45)');}}
/* text */
const FONT='"Press Start 2P"';
function TXT(g,s,x,y,col,o){o=o||{};const sz=o.size||8,w=Math.ceil(s.length*sz)+6,h=sz+6;const [c,t]=mk(w,h);t.font=sz+'px '+FONT;t.textBaseline='top';t.fillStyle='#fff';t.fillText(s,3,3);
 const im=t.getImageData(0,0,w,h),d=im.data;let maxX=0;for(let i=0;i<d.length;i+=4){const on=d[i+3]>100;d[i]=d[i+1]=d[i+2]=255;d[i+3]=on?255:0;if(on)maxX=Math.max(maxX,(i/4)%w);}t.putImageData(im,0,0);
 const [gc,gg]=mk(w,h);if(o.grad)bands(gg,0,3,w,sz,o.grad);else R(gg,0,0,w,h,col);t.globalCompositeOperation='source-in';t.drawImage(gc,0,0);t.globalCompositeOperation='source-over';
 if(o.outline)outline(c,o.outline,o.diag);if(o.outline2)outline(c,o.outline2,true);
 const tw=maxX-2;let ox=x-3;if(o.align==='center')ox=x-tw/2-3;else if(o.align==='right')ox=x-tw-3;
 if(o.shadow){const [sc,sg]=mk(w,h);sg.drawImage(c,0,0);sg.globalCompositeOperation='source-in';R(sg,0,0,w,h,o.shadow);g.drawImage(sc,Math.round(ox)+(o.sd||1),Math.round(y-3)+(o.sd||1));}
 g.drawImage(c,Math.round(ox),Math.round(y-3));return tw;}
/* sprite helper */
function spr(w,h,fn,ink,diag){const [c,g]=mk(w,h);fn(g);if(ink)outline(c,ink,diag);return c;}

/* ================= CATS ================= */
const CATS={
 persik:{name:'ПЕРСИК',base:'#ff9224',dark:'#db6d00',light:'#ffb66d',belly:'#ffdbb6',white:'#ffffff',eye:'#92ff49',ink:'#491c00',fat:1,stats:[2,3,5]},
 barsik:{name:'БАРСИК',base:'#926d49',dark:'#6d4924',light:'#b6926d',belly:'#dbb692',white:'#ffdbb6',eye:'#ffdb24',ink:'#240000',stats:[3,5,3]},
 stray:{name:'БРОДЯГА',base:'#929292',dark:'#6d6d6d',light:'#b6b6b6',belly:'#b6b6b6',white:'#dbdbdb',eye:'#ffff6d',ink:'#000000',thin:1,stats:[5,4,1]}
};
for(const k in CATS){const d=CATS[k];for(const p of ['base','dark','light','belly','white','eye','ink'])d[p]=snap(d[p]);d.pink=snap('#ff92b6');}
function catS(d,pose,f){
 f=f||0;return spr(40,28,g=>{
  const fat=d.fat?1:0,thin=d.thin?1:0;
  const bx=16,by=(pose==='jump'?14:16)-(pose==='run'&&f%2?1:0),brx=9+fat*2-thin*.5,bry=4+fat*1.4-thin*1.1;
  const ground=25;
  // tail
  let tail;
  if(pose==='run')tail=[[bx-brx+1,by-1],[bx-brx-3,by-3],[bx-brx-6,by-3-(f%2)],[bx-brx-8,by-2-(f%2)*2]];
  else if(pose==='jump')tail=[[bx-brx+1,by-1],[bx-brx-3,by-4],[bx-brx-5,by-8],[bx-brx-4,by-11]];
  else if(pose==='sit')tail=[[bx-3,ground-1],[bx-8,ground-1],[bx-11,ground-3],[bx-11,ground-6]];
  else tail=[[bx-brx+1,by-1],[bx-brx-2,by-4],[bx-brx-3,by-9],[bx-brx-1,by-12]];
  curve(g,tail,d.base,thin?2:3);P(g,tail[3][0],tail[3][1],d.dark);P(g,tail[2][0],tail[2][1],d.dark);
  // legs
  const leg=(x,y0,y1,dx,col,paw)=>{Ln(g,x,y0,x+dx,y1,col,thin?2:2+fat*0);R(g,x+dx-1,y1,3,1,paw);};
  if(pose==='sit'){const sy=ground-8;E(g,bx-2,ground-4,6+fat,4,d.dark);E(g,bx-2,ground-5,5.6+fat,3.4,d.base);E(g,bx,sy,5+fat,7.5,d.dark);E(g,bx,sy-1,5+fat,7,d.base);E(g,bx+2,sy+1,3+fat,5,d.belly);
   for(let i=0;i<3;i++)R(g,bx-4,sy-5+i*3,2,1,d.dark);R(g,bx+2,sy+3,2,ground-sy-3,d.base);R(g,bx+5,sy+3,2,ground-sy-3,d.light);R(g,bx+1,ground-1,3,1,d.white);R(g,bx+4,ground-1,3,1,d.white);}
  else{
   let a=[0,0,0,0];
   if(pose==='run')a=f%2?[-4,4,3,-3]:[3,-3,-4,4];
   if(pose==='jump')a=[-5,-4,5,4];
   const ly=by+bry-2;const len=pose==='jump'?4:ground-ly;
   leg(bx-brx+4,ly,ly+len,a[1],d.dark,d.belly);leg(bx+brx-3,ly,ly+len,a[3],d.dark,d.belly);
   // body
   E(g,bx,by,brx,bry,d.dark);E(g,bx,by-1,brx,bry-.6,d.base);
   if(fat){E(g,bx+1,by+bry-.4,brx-2.4,3.2,d.dark);E(g,bx+1,by+bry-1,brx-2.8,2.8,d.belly);}else E(g,bx+1,by+bry-1.2,brx-3,1.3,d.belly);
   for(let i=0;i<4;i++){const sx=Math.round(bx-6+i*3.2);R(g,sx,by-bry,2,2,d.dark);P(g,sx+1,by-bry+2,d.dark);}
   for(let x=bx-4;x<bx+3;x+=1)P(g,x,Math.round(by-bry+.2),d.light);
   if(thin){for(let i=0;i<3;i++)P(g,bx-1+i*2,by+1,d.dark);P(g,bx-5,by-bry+1,d.light);}
   leg(bx-brx+6,ly,ly+len,a[0],d.base,d.white);
   if(pose==='paw')leg(bx+brx-1,by,by+1,6,d.base,d.white);
   else if(pose==='claw'){Ln(g,bx+brx-1,by-1,bx+brx+3,by-7,d.base,2);R(g,bx+brx+2,by-9,3,2,d.white);}
   else leg(bx+brx-1,ly,ly+len,a[2],d.base,d.white);
  }
  // head
  const hx=pose==='sit'?bx+2:bx+brx+3,hy=pose==='sit'?ground-19:by-5-(pose==='claw'?1:0);
  const ear=(ax,ay,inner)=>{R(g,ax,ay,1,1,d.base);R(g,ax-1,ay+1,3,1,d.base);R(g,ax-2,ay+2,5,1,d.base);if(inner){P(g,ax,ay+1,d.pink);R(g,ax-1,ay+2,2,1,d.pink);}};
  ear(hx-3,hy-7,0);ear(hx+2,hy-7,1);if(thin){P(g,hx+2,hy-7,'rgba(0,0,0,0)');g.clearRect(hx+2,hy-7,1,2);}
  E(g,hx,hy,5.4+fat*.6-thin*.3,4.6+fat*.3,d.base);
  if(fat){P(g,hx-5,hy+2,d.base);P(g,hx+5,hy+2,d.base);}
  R(g,hx-2,hy-4,1,2,d.dark);R(g,hx,hy-4,1,2,d.dark);R(g,hx+2,hy-4,1,1,d.dark);
  E(g,hx+2.6,hy+2.1,2.8,1.9,d.white);
  if(thin){P(g,hx-5,hy+1,d.base);P(g,hx-6,hy+2,d.base);P(g,hx-5,hy+3,d.base);}
  // eyes
  R(g,hx+1,hy-1,2,2,d.eye);P(g,hx+2,hy-1,d.ink);P(g,hx+1,hy-1,'#ffffff');
  R(g,hx-2,hy-1,1,2,d.eye);P(g,hx-2,hy-1,d.ink);
  P(g,hx+5,hy+1,d.pink);
 },d.ink);
}
function catWhiskers(c,pose){return c;}

/* ================= DOG (Бублик, бигль) ================= */
pal({dTan:'#db924f',dTan2:'#b66d24',dBlk:'#242424',dEar:'#6d4924',dWh:'#ffffff'});
function dogS(pose,f){return spr(44,30,g=>{
 const bx=19,by=pose==='sleep'?22:17-(pose==='run'&&f%2?1:0),ground=28;
 if(pose==='sleep'){E(g,bx,by,12,5,C.dTan2);E(g,bx,by-1,12,4.4,C.dTan);E(g,bx-1,by-3,8,2.4,C.dBlk);E(g,bx+1,by+2,9,1.6,C.dWh);
  E(g,bx+12,by,5,4,C.dTan);E(g,bx+15,by+1.4,3,2,C.dWh);P(g,bx+18,by+1,C.ink);E(g,bx+10,by+1,1.6,3.6,C.dEar);R(g,bx+12,by-1,2,1,C.ink);
  curve(g,[[bx-11,by],[bx-15,by+1],[bx-13,by+3]],C.dTan,2);return;}
 const wag=pose==='bark'?-2:f%2?1:-1;
 curve(g,[[bx-10,by-2],[bx-13,by-6],[bx-12+wag,by-10]],C.dTan,2);P(g,bx-12+wag,by-11,C.dWh);
 let a=[0,0,0,0];if(pose==='run')a=f%2?[-4,4,4,-4]:[4,-4,-4,4];
 const leg=(x,dx,col)=>{Ln(g,x,by+2,x+dx,ground-1,col,3);R(g,x+dx-1,ground-1,4,1,C.dWh);};
 leg(bx-7,a[1],C.dTan2);leg(bx+7,a[3],C.dTan2);
 E(g,bx,by,11,5,C.dTan2);E(g,bx,by-1,11,4.4,C.dTan);E(g,bx-2,by-3,7.5,2.6,C.dBlk);E(g,bx+1,by+3,8,1.6,C.dWh);E(g,bx+8,by,3,4,C.dWh);
 leg(bx-5,a[0],C.dTan);leg(bx+9,a[2],C.dTan);
 const hx=bx+13,hy=by-6-(pose==='bark'?1:0);
 E(g,hx,hy,5,4.6,C.dTan);R(g,hx-1,hy-4,2,7,C.dWh);E(g,hx+4,hy+2,3.6,2.4,C.dWh);R(g,hx+7,hy,2,2,C.ink);
 if(pose==='bark'){R(g,hx+3,hy+3,6,2,C.r3);R(g,hx+4,hy+4,3,1,C.pink);}
 R(g,hx+1,hy-2,2,2,C.ink);P(g,hx+1,hy-2,'#ffffff');
 E(g,hx-3,hy+1,2,4.4,C.dEar);
 R(g,hx-4,hy+4,4,1,C.r1);P(g,hx-2,hy+5,C.y2);
},C.ink);}

 const was=cat.onGround;cat.onGround=false;

/* ---------- pause (DOM) ---------- */
const pauseEl=document.getElementById('pause');let prevState='play';
function openPause(){if(state!=='play'&&state!=='boss')return;prevState=state;state='pause';pauseEl.hidden=false;held.clear();}
function closePause(){pauseEl.hidden=true;state=prevState;held.clear();pressed.clear();}
document.getElementById('p-resume').addEventListener('click',closePause);
document.getElementById('p-restart').addEventListener('click',()=>{pauseEl.hidden=true;setState('select');stopMusic();playMusic('title');});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(1/30,(now-last)/1000);last=now;if(state!=='pause')update(dt);pressed.clear();render();requestAnimationFrame(frame);}
function boot(){prebuild();chooseCat('persik');requestAnimationFrame(frame);}
const fontReady=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('8px "Press Start 2P"','АБВ123'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontReady.then(boot,boot);
// tap on canvas: title → select; select → pick card
cv.addEventListener('pointerdown',e=>{ac();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
 if(state==='title'){pressed.add('tap');if(musicOn&&!SEQ.trk)playMusic('title');}
 else if(state==='select'&&y>40&&y<200){const i=Math.floor((x-10)/102);if(i>=0&&i<3){if(i===selIdx){pressed.add('B');}else{selIdx=i;SFX.select();}}}
 else if(state==='tally')pressed.add('tap');});
addEventListener('keydown',()=>{if(state==='title'&&musicOn&&!SEQ.trk)playMusic('title');},{once:false});
</script>
<script>
/* layout + touch controls */
(()=>{
 const wrap=document.getElementById('wrap');
 function isMob(){return (matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0&&!matchMedia('(pointer:fine)').matches);}
 function fit(){const mob=isMob(),port=innerHeight>innerWidth;document.body.classList.toggle('mob',mob);document.body.classList.toggle('portrait',mob&&port);
  const W=wrap.clientWidth,H=wrap.clientHeight-(mob&&port?0:0);let k=Math.min(W/320,(mob&&port?Math.min(H*.55,W*224/320):H)/224);if(!mob&&k>=2)k=Math.floor(k);
  cv.style.width=Math.floor(320*k)+'px';cv.style.height=Math.floor(224*k)+'px';}
 addEventListener('resize',()=>setTimeout(fit,60));addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
 const press=(k,on)=>{if(on){if(!held.has(k))pressed.add(k);held.add(k);}else held.delete(k);};
 document.querySelectorAll('.bts button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();ac();press(k,true);b.classList.add('on');try{navigator.vibrate&&navigator.vibrate(10);}catch(_){}try{b.setPointerCapture(e.pointerId);}catch(_){}
   if(state==='title')pressed.add('tap');});
  const off=()=>{press(k,false);b.classList.remove('on');};['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault());});
 const joy=document.getElementById('joy'),base=joy.querySelector('.joy-b'),knob=document.getElementById('knob');let id=null,cx=0,cy=0,R=50;
 const apply=(nx,ny)=>{knob.style.transform='translate(calc(-50% + '+(nx*R).toFixed(1)+'px),calc(-50% + '+(ny*R).toFixed(1)+'px))';press('left',nx<-.33);press('right',nx>.33);press('up',ny<-.6);press('down',ny>.6);};
 const mv=e=>{let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}apply(dx/R,dy/R);};
 joy.addEventListener('pointerdown',e=>{e.preventDefault();ac();id=e.pointerId;try{joy.setPointerCapture(id);}catch(_){}const r=base.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;R=r.width*.42;mv(e);});
 joy.addEventListener('pointermove',e=>{if(e.pointerId===id){e.preventDefault();mv(e);}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>joy.addEventListener(t,e=>{if(e.pointerId!==id)return;id=null;apply(0,0);}));
 const tog=(id,get,set)=>{const b=document.getElementById(id);b.addEventListener('click',()=>{ac();set(!get());b.setAttribute('aria-pressed',String(get()));});};
 tog('t-mus',()=>musicOn,v=>{musicOn=v;if(AU.c)AU.music.gain.value=v?.32:0;});
 tog('t-sfx',()=>sfxOn,v=>{sfxOn=v;if(AU.c)AU.sfx.gain.value=v?.6:0;});
 document.getElementById('t-st').addEventListener('click',()=>{ac();if(state==='pause')closePause();else if(state==='play'||state==='boss')openPause();else pressed.add('START');});
 document.addEventListener('gesturestart',e=>e.preventDefault());
})();
